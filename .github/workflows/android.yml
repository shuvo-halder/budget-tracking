name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Ei step-ti GitHub-ke nijei Gradle install korte bolbe
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    # Ekhane amra ./gradlew er bodole shudhu gradle bebohar korchi
    - name: Build Release APK
      run: gradle assembleRelease
      
    - name: Rename APK to Budget
      run: mv app/build/outputs/apk/release/app-release-unsigned.apk "app/build/outputs/apk/release/Budget.apk"
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Budget-Tracking-App
        path: "app/build/outputs/apk/release/Budget.apk"
