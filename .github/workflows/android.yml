name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Build Release APK
      run: gradle assembleRelease
      
    - name: Sign APK using Native Android Tools
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        # 1. Base64 text theke asol Keystore file toiri
        echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
        
        # 2. Latest Android Build Tools khuje ber kora
        BUILD_TOOLS=$(ls -1d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
        
        # 3. APK Zipalign kora (Google Play er niyam onujayi)
        $BUILD_TOOLS/zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
        
        # 4. Official apksigner diye APK Sign kora
        $BUILD_TOOLS/apksigner sign --ks my-upload-key.jks --ks-key-alias "$ALIAS" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --out "Budget.apk" aligned.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Budget-Tracking-App
        path: "Budget.apk"
