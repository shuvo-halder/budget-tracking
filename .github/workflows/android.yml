name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Optional restoration of development keystore if base64 file exists.
      - name: Restore development keystore if available
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$GITHUB_WORKSPACE/debug.keystore"
          BASE64_FILE="$GITHUB_WORKSPACE/debug.keystore.base64"

          if [ -f "$BASE64_FILE" ]; then
            base64 --decode "$BASE64_FILE" > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            echo "Development keystore restored successfully."
          else
            echo "debug.keystore.base64 not found in workspace; proceeding with Gradle configuration defaults."
          fi

      - name: Verify development keystore if present
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -list \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey >/dev/null
            echo "Development keystore validation passed."
          else
            echo "No development keystore to verify; skipping."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease

      - name: Sign and verify Release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD KEYSTORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret $name is missing or empty."
              exit 1
            fi
          done

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK path was not found."
            exit 1
          fi

          BUILD_TOOLS="$(
            find "$SDK/build-tools" \
              -mindepth 1 -maxdepth 1 -type d 2>/dev/null |
              sort -V | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS" ] || [ ! -d "$BUILD_TOOLS" ]; then
            echo "::error::Android Build Tools were not found under $SDK/build-tools."
            exit 1
          fi

          INPUT_APK="$(find app/build/outputs/apk/release -type f -name "*.apk" ! -name "*-aligned.apk" ! -name "*-signed.apk" | head -n 1)"
          if [ -z "$INPUT_APK" ] || [ ! -s "$INPUT_APK" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release."
            exit 1
          fi
          echo "Found generated release APK: $INPUT_APK"

          KEYSTORE_FILE="$RUNNER_TEMP/release-signing.jks"
          ALIGNED_APK="$RUNNER_TEMP/Budget-aligned.apk"
          SIGNED_APK="$GITHUB_WORKSPACE/Budget.apk"

          cleanup() {
            rm -f "$KEYSTORE_FILE" "$ALIGNED_APK"
          }
          trap cleanup EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi

          if "$BUILD_TOOLS/apksigner" verify "$INPUT_APK" >/dev/null 2>&1; then
            echo "Release APK is already signed. Skipping signing."
            cp "$INPUT_APK" "$SIGNED_APK"
          else
            echo "Release APK is unsigned. Proceeding with zipalign and apksigner..."

            if "$BUILD_TOOLS/zipalign" -c 4 "$INPUT_APK" >/dev/null 2>&1; then
              echo "Input APK is already 4-byte aligned."
              cp "$INPUT_APK" "$ALIGNED_APK"
            else
              echo "Aligning APK using zipalign..."
              "$BUILD_TOOLS/zipalign" -f -v 4 "$INPUT_APK" "$ALIGNED_APK"
            fi

            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
          fi

          echo "Verifying final APK alignment..."
          "$BUILD_TOOLS/zipalign" -c -v 4 "$SIGNED_APK"

          echo "Verifying final APK signature..."
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK"

          echo "Signed APK verification passed successfully."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Tracking-App
          path: Budget.apk
          if-no-files-found: error
          retention-days: 14
